[metadata]
name = agentic-security-demos
version = 0.1.0

[options]
packages = find:
python_requires = >=3.11
install_requires =
    pytest>=7.4.0
    pyyaml>=6.0
    cryptography>=41.0.0

[options.extras_require]
dev =
    pytest-cov>=4.1.0
    mypy>=1.5.0
    ruff>=0.1.0
    pre-commit>=3.5.0

[options.packages.find]
where = .

[tool:pytest]
testpaths = demo-*/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    exercise = marks exercise tests
    slow = marks slow tests
    safety = marks safety-critical tests