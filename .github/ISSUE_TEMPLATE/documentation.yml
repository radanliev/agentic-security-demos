name: Documentation Improvement
description: Report unclear, missing, or incorrect documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: location
    attributes:
      label: Documentation Location
      options:
        - Root README.md
        - Demo README.md (specify which)
        - CONTRIBUTING.md
        - SECURITY.md
        - RESPONSIBLE_USE.md
        - CODE_OF_CONDUCT.md
        - Docstrings / inline comments
        - docs/ directory
        - Makefile help text
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue Description
      description: What is unclear, missing, or incorrect?
      placeholder: The explanation of X is confusing because...
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should it be improved?
      placeholder: Add an example showing... / Clarify that...
    validations:
      required: true