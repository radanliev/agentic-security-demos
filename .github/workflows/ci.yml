name: CI - Offline Tests Only

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  test-all-demos:
    name: Test All Demos (Offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install root dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run root setup
        run: make setup

      - name: Test demo-01-blind-verification
        run: |
          cd demo-01-blind-verification
          make test

      - name: Test demo-02-supply-chain-aibom
        run: |
          cd demo-02-supply-chain-aibom
          make test

      - name: Test demo-03-eval-invariants
        run: |
          cd demo-03-eval-invariants
          make test

      - name: Test demo-04-authoritybound
        run: |
          cd demo-04-authoritybound
          make test

      - name: Test demo-05-eviassure
        run: |
          cd demo-05-eviassure
          make test

      - name: Test demo-06-reconscope
        run: |
          cd demo-06-reconscope
          make test

      - name: Test demo-07-triagetrap
        run: |
          cd demo-07-triagetrap
          make test

      - name: Test demo-08-inclusiontrap
        run: |
          cd demo-08-inclusiontrap
          make test

      - name: Test demo-09-interceptbound
        run: |
          cd demo-09-interceptbound
          make test

      - name: Test demo-10-scanbound
        run: |
          cd demo-10-scanbound
          make test

      - name: Test demo-11-degenerate-reporting
        run: |
          cd demo-11-degenerate-reporting
          make test

      - name: Test demo-12-provenancebound
        run: |
          cd demo-12-provenancebound
          make test

      - name: Verify no network access in tests
        run: |
          # Smoke check; real enforcement is by test design
          echo "All tests completed without network dependencies"

  check-safety:
    name: Safety Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden patterns
        run: |
          # Fail if any test imports network libraries
          if grep -r "^import socket\|^import requests\|^import urllib\|^from urllib\|^import http.client\|^import aiohttp\|^import httpx" --include="*test*.py" .; then
            echo "ERROR: Network imports found in test code"
            exit 1
          fi
          # Fail if any runtime module (demo-*/student, shared/) imports a network library
          # (shared/reproducibility.py imports socket only to disable it — enforce_offline — and is excluded by name)
          if grep -r "^import socket\|^from socket\|^import requests\|^from requests\|^import urllib$\|^import urllib\.request\|^from urllib\.request\|^from urllib import request\|^import http\.client\|^from http import client\|^import aiohttp\|^import httpx" --include="*.py" --exclude=reproducibility.py demo-*/student/ shared/; then
            echo "ERROR: Network imports found in runtime code"
            exit 1
          fi

      - name: Check for real credentials
        run: |
          if grep -r "sk-\|ghp_\|gho_\|ghu_\|ghs_\|github_pat_\|aws_access_key\|AWS_SECRET\|BEGIN PRIVATE\|-----BEGIN" --include="*.py" --include="*.json" --include="*.yml" --include="*.yaml" --exclude-dir=.github . | grep -v "task-00"; then
            echo "ERROR: Potential credentials found"
            exit 1
          fi

      - name: Check for external URLs in tests
        run: |
          if grep -r "http://\|https://" --include="*test*.py" . | grep -v "example.com\|localhost\|127.0.0.1\|0.0.0.0"; then
            echo "ERROR: External URLs found in tests"
            exit 1
          fi

      - name: Verify result schema consistency
        run: |
          python3 -c "
import json, glob, sys
schema_keys = {'demo','experiment','seed','commit','environment','command','result','notes'}
for f in glob.glob('demo-*/results/*.json') + glob.glob('demo-*/tests/*.json'):
    try:
        with open(f) as fp:
            data = json.load(fp)
        if not schema_keys.issubset(data.keys()):
            print(f'WARNING: {f} missing keys: {schema_keys - set(data.keys())}')
    except Exception as e:
        print(f'ERROR reading {f}: {e}')
          "

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          pip install ruff mypy

      - name: Run ruff (linting)
        run: |
          ruff check . --exclude demo-*/results --exclude demo-*/__pycache__ --exclude .pytest_cache --exclude .venv

      - name: Run ruff format check
        run: |
          ruff format --check . --exclude demo-*/results --exclude demo-*/__pycache__ --exclude .pytest_cache --exclude .venv

      - name: Run mypy (type checking)
        run: |
          mypy --strict --exclude "demo-*/results,demo-*/__pycache__,.pytest_cache,.venv" demo-*/student demo-*/tests shared

  verify-reproducibility:
    name: Reproducibility Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run all demos and verify deterministic output
        run: |
          make setup
          for demo in 01 02 03 04 05 06 07 08 09 10 11 12; do
            echo "=== Running demo-$demo ==="
            set -o pipefail; make demo DEMO=$demo 2>&1 | tail -20
            echo ""
          done
          echo "All demos completed successfully"

  check-docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required files
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "RESPONSIBLE_USE.md"
            "CHANGELOG.md"
            "CITATION.cff"
            "FUNDING.yml"
            "SUPPORT.md"
            "Makefile"
            "requirements.txt"
            "pyproject.toml"
            ".github/workflows/ci.yml"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/CODEOWNERS"
            ".github/dependabot.yml"
            ".github/ISSUE_TEMPLATE/bug_report.yml"
            ".github/ISSUE_TEMPLATE/feature_request.yml"
            ".github/ISSUE_TEMPLATE/documentation.yml"
            ".pre-commit-config.yaml"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Check demo READMEs
        run: |
          for d in demo-*/; do
            if [ ! -f "${d}README.md" ]; then
              echo "MISSING README: $d"
              exit 1
            fi
            # Check for required sections
            grep -q "Learning Objectives" "${d}README.md" || echo "WARNING: ${d}README.md missing Learning Objectives"
            grep -q "Safety Notice" "${d}README.md" || echo "WARNING: ${d}README.md missing Safety Notice"
            grep -q "Reproducibility" "${d}README.md" || echo "WARNING: ${d}README.md missing Reproducibility"
          done

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test-all-demos, check-safety, code-quality, verify-reproducibility, check-docs]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "=== CI Summary ==="
          echo "All jobs completed. Check individual job logs for details."
          if [ "${{ needs.test-all-demos.result }}" == "success" ] && \
             [ "${{ needs.check-safety.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.verify-reproducibility.result }}" == "success" ] && \
             [ "${{ needs.check-docs.result }}" == "success" ]; then
            echo "✅ ALL CHECKS PASSED"
            exit 0
          else
            echo "❌ SOME CHECKS FAILED"
            exit 1
          fi